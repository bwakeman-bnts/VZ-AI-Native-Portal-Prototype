<x-dc>
<div onClick="{{ onClose }}" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:vzFade 150ms ease">
  <div onClick="{{ stopPropagation }}" style="position:relative;background:radial-gradient(ellipse 700px 500px at 15% 10%, rgba(255,255,255,.9), transparent 60%), radial-gradient(ellipse 600px 500px at 95% 85%, rgba(190,150,90,.35), transparent 65%), var(--vds-stone);border-radius:8px;max-width:880px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 16px 24px rgba(0,0,0,.08)">
    <div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg, #F2A08C, #F8FF3C);pointer-events:none"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--vds-border-default)">
      <h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px;color:#000">Choose a profile</h2>
      <button onClick="{{ onClose }}" title="Close" style="flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;cursor:pointer;border-radius:9999px" style-hover="background:rgba(0,0,0,.06)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <div style="padding:24px;display:flex;flex-direction:column;gap:8px">
      <h3 style="margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:-.3px;color:#000"><img src="uploads/AISparkle.svg" alt="" style="width:20px;height:20px;display:block;flex:none">The AI Native Portal</h3>
      <p style="margin: 0 0 8px; font-size: 18px; color: var(--vds-black); font-weight: 400">These personas all work for Cascade Logistics, a professional services company with roughly 150 lines. This personalized portal experience serves up content that is specific to their roles and needs.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
        <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="4">
          <button onClick="{{ p.select }}" style="text-align:left;display:flex;flex-direction:column;gap:12px;border:1px solid var(--vds-border-default);border-radius:8px;padding:18px;background:var(--vds-stone);cursor:pointer" style-hover="border-color:#000">
            <div style="width:128px;height:128px;border-radius:9999px;background:var(--vds-background-lowcontrast);border:1px solid var(--vds-border-default);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#000;overflow:hidden;background-image:url('{{ p.photo }}');background-size:cover;background-position:center">
              <sc-if value="{{ p.showInitials }}" hint-placeholder-val="{{ true }}">
                {{ p.initials }}
              </sc-if>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:18px;font-weight:700;color:#000">{{ p.name }}</span>
              <span style="font-size: 16px; color: var(--vds-element-secondary)">{{ p.role }}</span>
            </div>
            <p style="margin: 0; font-size: 16px; line-height: 21px; color: var(--vds-element-secondary)">{{ p.description }}</p>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      stopPropagation: (e) => { if (e && e.stopPropagation) e.stopPropagation(); }
    };
  }
}
</script>
